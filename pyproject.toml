[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-first-rag"
version = "0.1.0"
description = "A local-only, access-controlled RAG knowledge assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb==1.0.20",
  "httpx==0.28.1",
  "langgraph==1.2.16",
  "PyMuPDF==1.26.4",
  "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/privacy_rag"]
